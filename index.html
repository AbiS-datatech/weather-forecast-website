
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-container">
        <header class="header">
            <h1>Weather Forecast</h1>
            <p>Discover the weather in your city</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </section>

        <p id="message"></p>

        <section class="weather-card" id="weatherCard">
            <div class="location">
                <h2 id="cityName">--</h2>
                <p id="date">--</p>
            </div>

            <div class="current-weather">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div>
                    <h1 id="temperature">--°C</h1>
                    <p id="weatherCondition">--</p>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail">
                    <span>Feels Like</span>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail">
                    <span>Humidity</span>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>Wind Speed</span>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>
            </div>
        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div class="forecast-container" id="forecastContainer"></div>
        </section>


        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
